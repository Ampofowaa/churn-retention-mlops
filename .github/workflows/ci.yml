name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly (Mondays) 06:13 UTC canary for upstream drift (postgres image,
    # runner image, actions) — deps are lockfile-pinned, so daily adds nothing.
    # Offset from :00 to avoid the top-of-hour scheduling queue.
    - cron: "13 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          cache-suffix: "unit"

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Cache pre-commit environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-py3.13-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Pre-commit hooks
        # mypy is skipped here: the dedicated "Type check" step below already runs it.
        run: uv run pre-commit run --all-files --show-diff-on-failure
        env:
          SKIP: mypy

      - name: Lint
        run: uv run ruff check src/

      - name: Type check
        run: uv run mypy src/

      - name: Unit tests + coverage
        run: uv run pytest -m "not integration" -n auto

  integration:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.base_ref == 'main')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          cache-suffix: "integration"

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      # testcontainers would otherwise pull these from inside the tests, from
      # every xdist worker at once; a transient Docker Hub refusal then fails
      # one test's setup ("unauthorized: authentication required" on an
      # anonymous pull). One retried pull up front leaves them cached for
      # every test. Ryuk is testcontainers' own cleanup container; its tag is
      # read from the installed package so a library bump can't leave it stale.
      - name: Pre-pull test images
        run: |
          ryuk=$(uv run python -c "from testcontainers.core.config import testcontainers_config as c; print(c.ryuk_image)")
          for image in postgres:16 "${ryuk}"; do
            for attempt in 1 2 3; do
              docker pull "${image}" && break
              [ "${attempt}" -lt 3 ] || exit 1
              echo "pull of ${image} failed (attempt ${attempt}), retrying in 15s"
              sleep 15
            done
          done

      - name: Integration tests
        run: uv run pytest -m integration --run-integration --no-cov -n auto
